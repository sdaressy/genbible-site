<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GenBible — Scripture that hits different</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
            background: #F5F1E8;
            color: #2D2A26;
            line-height: 1.7;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
        }
        .container {
            max-width: 480px;
            text-align: center;
        }
        .crown {
            font-size: 48px;
            margin-bottom: 16px;
        }
        h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 8px;
        }
        .tagline {
            font-size: 18px;
            color: #8A857D;
            margin-bottom: 32px;
        }
        .badge {
            display: inline-block;
            background: #2D2A26;
            color: #F5F1E8;
            padding: 14px 28px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            text-decoration: none;
            margin-bottom: 32px;
            transition: opacity 0.2s;
        }
        .badge:hover {
            opacity: 0.85;
        }
        .links {
            display: flex;
            gap: 24px;
            justify-content: center;
            margin-top: 24px;
        }
        .links a {
            font-size: 14px;
            color: #8A857D;
            text-decoration: none;
        }
        .links a:hover {
            color: #9D4EDD;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="crown">👑</div>
        <h1>GenBible</h1>
        <p class="tagline">Scripture that hits different.</p>
        <a class="badge" href="https://apps.apple.com/app/genbible/id6740587498">Download on the App Store</a>
        <div class="links">
            <a href="/privacy">Privacy Policy</a>
            <a href="/terms">Terms of Use</a>
            <a href="mailto:support@genbible.app">Contact</a>
        </div>
    </div>
</body>
</html>
